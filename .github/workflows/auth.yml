name: Next.js auth checks
on:
  push:
    paths: ['Next-JS/Auth/**', '.github/workflows/auth.yml']
  pull_request:
    paths: ['Next-JS/Auth/**', '.github/workflows/auth.yml']
permissions:
  contents: read
jobs:
  auth:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Next-JS/Auth
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Next-JS/Auth/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run test:integration
      - run: npm run typecheck
      - run: npm run build
